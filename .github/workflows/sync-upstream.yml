name: Sync upstream

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC daily, before the dmit deploy at 04:30 PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'HAOGRE/cn-math-taxonomy'
    runs-on: ubuntu-latest
    steps:
      - name: Merge xiaoyang111222/cn-math-taxonomy main into fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main
